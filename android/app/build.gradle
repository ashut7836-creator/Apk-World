plugins {
    id "com.android.application"
}

def signingPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "worldmod-release"
def releaseStore = file("$buildDir/secure/worldmod-official-release.p12")

android {
    namespace "com.worldmodsofficial.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.worldmodsofficial.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        if (signingPassword) {
            release {
                storeFile releaseStore
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingPassword
                storeType "PKCS12"
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (signingPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
