plugins {
    id "com.android.application"
}

android {
    namespace "com.worldmodsofficial.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.worldmodsofficial.app"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
