name: Build WorldMod Official Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  signed-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare permanent signing key
        env:
          ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 || secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SIGNING_KEY_B64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing repository secrets. Add ANDROID_SIGNING_KEY_BASE64 (or ANDROID_SIGNING_KEY) and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          mkdir -p android/app/build/secure
          printf '%s' "$ANDROID_SIGNING_KEY_B64" | base64 --decode > android/app/build/secure/worldmod-official-release.p12
          chmod 600 android/app/build/secure/worldmod-official-release.p12
          keytool -list -keystore android/app/build/secure/worldmod-official-release.p12 -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias worldmod-release >/dev/null
          echo "Permanent signing key loaded and alias verified."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: worldmod-release
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | grep -E "^package: name='com.worldmodsofficial.app' versionCode='3' versionName='1.2.0'"
          cp "$APK" android/app/build/outputs/apk/release/WorldMod-Official.apk
          sha256sum android/app/build/outputs/apk/release/WorldMod-Official.apk

      - name: Upload signed validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldMod-Official-Signed-Validation
          path: android/app/build/outputs/apk/release/WorldMod-Official.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/build/secure/worldmod-official-release.p12
