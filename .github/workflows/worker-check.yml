name: Validate Cloudflare Worker
on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - cloudflare/src/index.js
      - cloudflare/scan-string.cjs
      - .github/workflows/worker-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose embedded HTML strings
        run: node cloudflare/scan-string.cjs
      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare/src/index.js
