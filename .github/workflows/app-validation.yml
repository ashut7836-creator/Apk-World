name: Validate World Mods app shell

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "app-shell.js"
      - "app-shell.css"
      - "community.js"
      - "service-worker.js"
      - "manifest.json"
      - ".github/workflows/app-validation.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "app-shell.js"
      - "app-shell.css"
      - "community.js"
      - "service-worker.js"
      - "manifest.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-shell.js
          node --check community.js
          node --check shoutout.js
          node --check pwa.js
          node --check service-worker.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Verify app shell assets
        run: |
          test -s index.html
          test -s app-shell.css
          test -s app-shell.js
          grep -q 'id="home-view"' index.html
          grep -q 'id="explore-view"' index.html
          grep -q 'id="community-view"' index.html
          grep -q 'id="profile-view"' index.html
